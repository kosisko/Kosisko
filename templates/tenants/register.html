<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Kosisko SaaS Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-2">
                <i class="fa-solid fa-rocket text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Start Your Workspace</h2>
            <p class="text-xs text-slate-400">1 मिनट के अंदर अपनी कंपनी का SaaS पोर्टल और सब-डोमेन बनाएं।</p>
        </div>

        <!-- Alert Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-3 rounded-xl text-xs font-semibold bg-red-500/20 text-red-300 border border-red-500/30">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Registration Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Company / Business Name</label>
                <input type="text" name="company_name" required placeholder="e.g. Tata Motors" 
                       class="w-full bg-slate-900 text-sm p-3 rounded-xl border border-slate-700 focus:border-indigo-500 outline-none text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Choose Subdomain Slug</label>
                <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-indigo-500">
                    <input type="text" name="subdomain" required placeholder="tata" 
                           class="w-full bg-transparent text-sm p-3 outline-none text-white text-right font-mono">
                    <span class="bg-slate-800 px-3 py-3 text-xs text-indigo-400 font-bold border-l border-slate-700">.localhost:8000</span>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 pt-2 border-t border-slate-700">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Your Full Name</label>
                    <input type="text" name="owner_name" required placeholder="Ratan Tata" 
                           class="w-full bg-slate-900 text-sm p-3 rounded-xl border border-slate-700 focus:border-indigo-500 outline-none text-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="admin@tata.com" 
                           class="w-full bg-slate-900 text-sm p-3 rounded-xl border border-slate-700 focus:border-indigo-500 outline-none text-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full bg-slate-900 text-sm p-3 rounded-xl border border-slate-700 focus:border-indigo-500 outline-none text-white">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition-all text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Create SaaS Workspace
            </button>
        </form>

    </div>

</body>
</html>
